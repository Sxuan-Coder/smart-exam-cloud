server:
  port: 8080 # 允许端口号
spring:
  main:
    # 关闭banner
    banner-mode: console
    # 允许循环引用
    allow-circular-references: true
  # mysql配置
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/db_exam?useSSL=false&serverTimezone=Asia/Shanghai&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: <your-mysql-password> # TODO: 填写你的 MySQL 密码
    driver-class-name: com.mysql.cj.jdbc.Driver
  # redis配置
  redis:
    database: 0
    host: 127.0.0.1
    port: 6379
    # password:
    timeout: 10s
    lettuce: # Redis连接池配置
      pool:
        # 连接池最大连接数 默认8 ，负数表示没有限制
        max-active: 8
        # 连接池最大阻塞等待时间（使用负值表示没有限制） 默认-1
        max-wait: -1
        # 连接池中的最大空闲连接 默认8
        max-idle: 8
        # 连接池中的最小空闲连接 默认0
        min-idle: 0
  servlet:
    multipart:
      max-file-size: 5MB
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
#MybatisPlus配置
mybatis-plus:
  global-config:
    # 关闭banner
    banner: false
    db-config:
      # 逻辑删除配置
      logic-not-delete-value: 0  # 未删除值
      logic-delete-value: 1      # 已删除值
  configuration:
#    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case:
  type-aliases-package: top.sxuan.exam.model

#jwt配置 密钥、过期时间、检查是否快到期时间
jwt:
  secret: <please-replace-with-a-random-secret-of-at-least-64-chars> # TODO: 填写 ≥64 字符的随机字符串
  expiration: 1800000 # 30分钟，单位为毫秒 token过期时间
  refreshThreshold: 900000  # 15分钟，单位为毫秒 判断是否剩xx分钟过期

# 阿里云oss文件存储服务（如使用 minio 可不填）
oss:
  endpoint: https://oss-cn-beijing.aliyuncs.com
  access-key-id: <your-oss-access-key-id> # TODO: 填写阿里云 AccessKey Id
  access-key-secret: <your-oss-access-key-secret> # TODO: 填写阿里云 AccessKey Secret
  bucket-name: online-exam-system-backend

# Minio本地文件存储服务
minio:
  endpoint: http://127.0.0.1:9000 # minio服务地址
  accesskey: admin # minio用户名
  secretKey: <your-minio-secret-key> # TODO: 填写 minio 密码
  bucket: online-exam #桶名


# Dify Api
dify:
  base-url: "https://api.dify.ai/v1/chat-messages"
  api-key: "<your-dify-api-key>" # TODO: 填写 Dify api-key

# llm 大语言模型配置
llm:
  api-key: "<your-llm-api-key>" # TODO: 填写 LLM api-key
  base-url: "<your-llm-base-url>" # 例如 https://api.example.com/v1
  model: "claude-4.5-sonnet"

# embedding 模型配置
embedding:
  api-key: "<your-embedding-api-key>" # TODO: 填写 embedding api-key
  base-url: "https://api.siliconflow.cn/v1/embeddings"
  model: "BAAI/bge-large-zh-v1.5"

# Milvus向量数据库配置
milvus:
  username: root
  password: <your-milvus-password> # TODO: 填写 Milvus 密码
  host: 192.168.49.130
  port: 19530

# 日志配置
logging:
  level:
    root: info
    com.example: debug

#自定义配置
online-exam:
  chat-platform:
    type: llm #ai调用方式
  storage:
    type: minio # 存储方式的配置 aliyun、minio（本地开发推荐 minio）
  login:
    captcha:
      enabled: true #是否启用验证码登录
system:
  register:
    enabled: true  # 控制是否开放注册功能
